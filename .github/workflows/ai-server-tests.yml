name: AI Server Tests

on:
  push:
    branches: [main]
    paths:
      - 'ai-server/**'
      - '.github/workflows/ai-server-tests.yml'
  pull_request:
    branches: [main, 'cursor/**']
    paths:
      - 'ai-server/**'
      - '.github/workflows/ai-server-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-server/package-lock.json

      - name: Install dependencies
        working-directory: ai-server
        run: npm ci

      - name: Run lint
        working-directory: ai-server
        run: npm run lint

      - name: Run typecheck
        working-directory: ai-server
        run: npm run typecheck

      - name: Run tests
        working-directory: ai-server
        env:
          SUPABASE_JWT_SECRET: test-secret-key-at-least-32-characters-long
        run: npm test
