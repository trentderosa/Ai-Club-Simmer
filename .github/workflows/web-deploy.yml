name: Web deploy (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web export
    runs-on: ubuntu-latest
    # configure-pages reads the Pages site settings; read-only, no write or OIDC here.
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: app
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      # Mock mode is on unless EXPO_PUBLIC_MOCK_MODE is set to something else.
      EXPO_PUBLIC_MOCK_MODE: ${{ vars.EXPO_PUBLIC_MOCK_MODE || '1' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_AI_SERVER_URL: ${{ vars.EXPO_PUBLIC_AI_SERVER_URL }}
      EXPO_NO_DOTENV: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Require real values when mock mode is off
        run: |
          if [ "$EXPO_PUBLIC_MOCK_MODE" = "1" ]; then
            echo "Mock mode: building with fake data and no backend."
            exit 0
          fi
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          missing=""
          [ -z "$(trim "$EXPO_PUBLIC_SUPABASE_URL")" ] && missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -z "$(trim "$EXPO_PUBLIC_SUPABASE_ANON_KEY")" ] && missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "$(trim "$EXPO_PUBLIC_AI_SERVER_URL")" ] && missing="$missing EXPO_PUBLIC_AI_SERVER_URL"
          if [ -n "$missing" ]; then
            echo "::error::Mock mode is off but these repository variables are not set:$missing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck, lint, secrets, tests)
        run: npm run check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Export web build for Pages
        # base_path is /<repo name> for a project site and empty for a custom domain (root).
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: npm run export:web:pages

      - name: Check build output for service-role keys
        run: npm run check:secrets:dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
