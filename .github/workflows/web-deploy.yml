name: Web deploy (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web export
    runs-on: ubuntu-latest
    # configure-pages reads the Pages site settings; read-only, no write or OIDC here.
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: app
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      # Public values only. The anon key belongs here; a service-role key does not.
      # Unset stays mock. Repository variables are strings, so the string "0" is
      # kept by `||` and only an empty value becomes 1. Do not rewrite this as
      # `!= ''`: Actions compares loosely, and the string "0" equals "".
      EXPO_PUBLIC_MOCK_MODE: ${{ vars.EXPO_PUBLIC_MOCK_MODE || '1' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_AI_SERVER_URL: ${{ vars.EXPO_PUBLIC_AI_SERVER_URL }}
      EXPO_NO_DOTENV: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Require real values when mock mode is off
        # Same rules as app/src/api/config.ts (pagesConfigProblems). Runs before
        # npm ci; the script has no dependencies. Prints names, never values.
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/check-pages-config.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck, lint, secrets, tests)
        run: npm run check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Export web build for Pages
        # base_path is /<repo name> for a project site and empty for a custom domain (root).
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: npm run export:web:pages

      - name: Check build output for service-role keys
        run: npm run check:secrets:dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
